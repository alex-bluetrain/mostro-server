services:
  mongo:
    image: mongo:7
    container_name: mostro-server-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mostro-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mostro-server
    # Overrides the image CMD: locally we do NOT run `infisical run`. Secrets
    # come from .env.docker (env_file), so node starts directly.
    command: ["node", "index.mjs"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets come from .env.docker (no Infisical). That file already points
    # MONGODB_URI at the `mongo` service and NGROK_FORWARD_ADDR at the backend
    # `mostro-server:4111`, using the compose network hostnames.
    env_file:
      - .env.docker
    ports:
      - "4111:4111"
    volumes:
      - mostro-data:/data

  mostro-app-web:
    build:
      context: ../mostro-app
      dockerfile: Dockerfile
      # The web build does NOT take MOSTRO_SERVER_URL / GOOGLE_CLIENT_ID as build
      # args: it reads them at runtime from /config.js. Requires
      # ../mostro-app/public/config.js (gitignored; copy public/config.js.example).
      args:
        # Dev-only: enables the API-key login on the auth screen.
        EXPO_PUBLIC_DEV_LOGIN: ${EXPO_PUBLIC_DEV_LOGIN:-1}
    container_name: mostro-app-web
    # Opt-in: only starts with `docker compose --profile web up`. Not part of the
    # daily loop (which runs the app with `npx expo start`); used to check the
    # packaged web artifact (nginx serving the static export).
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "8097:80"

volumes:
  mongo-data:
  mostro-data:
