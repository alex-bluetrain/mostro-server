name: Deploy

# Called by the Release workflow right after the image is published (auto-deploy),
# and available manually for rollback to any prior tag.
on:
  workflow_call:
    inputs:
      version:
        description: 'Tag to deploy (e.g. v1.2.0).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        # No default on purpose: rollback relies on immutable tags, so opening the
        # form and hitting enter must not take the non-reproducible path.
        description: 'Tag to deploy (e.g. v1.2.0). Copy it from the Releases tab.'
        required: true
        type: string

permissions:
  contents: read
  # id-token: WIF for the SSH into the VM. packages: read the manifest on ghcr.io.
  id-token: write
  packages: read

# One deploy at a time. No cancel-in-progress: aborting a deploy mid-run leaves the VM in a weird state.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest

    env:
      # Both triggers (workflow_call from Release, workflow_dispatch for rollback)
      # provide the tag through inputs.version.
      VERSION: ${{ inputs.version }}

    steps:
      # project_id goes through a secret so Actions masks it (`***`) in the
      # logs: the action exports it in CLOUDSDK_*/GCLOUD_PROJECT and this repo is
      # public. Same rationale as VM_NAME and ZONE.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      # Fail here and not mid-deploy: if the tag doesn't exist, the VM is never touched.
      # manifest inspect queries the registry without pulling the image.
      - name: Verify the tag exists in GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' does not exist in $IMAGE."
            echo "::error::Check the published tags at https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
            exit 1
          fi
          echo "Tag '$VERSION' found."

      # The deploy directory's .env only carries IMAGE_TAG: the app secrets are
      # resolved by Infisical inside the container. Nothing sensitive travels
      # through here. The path goes through a secret so it stays out of the public logs.
      - name: Update the VM
        env:
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
          DEPLOY_DIR: ${{ secrets.GCP_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Retry: the IAP tunnel can fail transiently (e.g. 4010
          # 'destination read failed'). The remote command is idempotent, so
          # retrying is safe.
          for attempt in 1 2 3; do
            if gcloud compute ssh "$VM_NAME" \
              --zone "$ZONE" \
              --tunnel-through-iap \
              --quiet \
              --command "set -euo pipefail && \
                echo 'IMAGE_TAG=$VERSION' | sudo tee '$DEPLOY_DIR/.env' >/dev/null && \
                cd '$DEPLOY_DIR' && \
                sudo docker compose pull && \
                sudo docker compose up -d --remove-orphans --force-recreate"; then
              exit 0
            fi
            echo "SSH failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not update the VM after 3 SSH attempts."
          exit 1

      - name: Wait for the app to be healthy
        env:
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            # || echo ssh-failed: a transient IAP tunnel failure must not
            # kill the loop (set -e); it counts as an attempt and retries.
            STATUS=$(gcloud compute ssh "$VM_NAME" --zone "$ZONE" --tunnel-through-iap --quiet \
              --command "sudo docker inspect -f '{{.State.Health.Status}}' mostro-app-1 2>/dev/null || echo unknown" \
              || echo ssh-failed)
            STATUS=$(echo "$STATUS" | tr -d '\r\n')
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Deploy OK." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The app did not become healthy within ~5 min. Check: docker compose logs app"
          exit 1
